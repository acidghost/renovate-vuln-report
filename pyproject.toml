[project]
name = "renovate-vuln-report"
version = "0.1.0"
description = "Report vulnerabilities in Renovate pull request image updates"
readme = "README.md"
authors = [
    { name = "acidghost", email = "acidghost@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "oras==0.2.43",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.1",
    "ty==0.0.86",
]

[project.scripts]
renovate-vuln-report = "renovate_vuln_report.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"
# Temporary eMudhra security exception, bounded to the reviewed certifi release.
# Remove after 2026-10-28, when that release clears the one-week delay.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

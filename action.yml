name: Renovate Vulnerability Report
description: Report vulnerabilities in Renovate pull request image updates
inputs:
  setup-uv:
    description: "Install uv; set to false to use uv already available on PATH"
    required: false
    default: "true"
  grype-check-for-app-update:
    description: "Enable Grype's startup version-check request to Anchore (does not control vulnerability database updates)"
    required: false
    default: "false"
  report-surface:
    description: "Report surface to publish to: summary or pr-comment"
    required: false
    default: summary
  forge:
    description: "Forge hosting the pull request: github, forgejo, or gitea"
    required: false
    default: github
  forge-api-url:
    description: "Forge API URL, usually ${{ github.api_url }}"
    required: false
    default: ${{ github.api_url }}
  token:
    description: "Forge token used when report-surface is pr-comment"
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Set up uv
      if: ${{ inputs.setup-uv == 'true' }}
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.12.23"
        working-directory: ${{ github.action_path }}
        enable-cache: "false"
    - name: Generate Renovate vulnerability report
      shell: bash
      env:
        GRYPE_CHECK_FOR_APP_UPDATE: ${{ inputs.grype-check-for-app-update }}
        FORGE_TOKEN: ${{ inputs.token }}
        RENOVATE_VULN_REPORT_SURFACE: ${{ inputs.report-surface }}
        RENOVATE_VULN_REPORT_FORGE: ${{ inputs.forge }}
        INPUTS_FORGE_API_URL: ${{ inputs.forge-api-url }}
      run: >-
        uv run --locked --no-dev --isolated --project "$GITHUB_ACTION_PATH"
          renovate-vuln-report --forge-api-url "${INPUTS_FORGE_API_URL}"

name: Renovate Vulnerability Report
description: Report vulnerabilities in Renovate pull request image updates
inputs:
  log-level:
    description: "Action logging verbosity: debug, info, warning, error, or critical (case-insensitive); defaults to debug when RUNNER_DEBUG=1, otherwise info. Does not change Grype logging."
    required: false
    default: ""
  setup-uv:
    description: "Install uv; set to false to use uv already available on PATH"
    required: false
    default: "true"
  cache-grype-db:
    description: "Restore the Grype vulnerability database prepared by the default-branch warmup action"
    required: false
    default: "true"
  cache-scans:
    description: "Cache successful Vulnerability Scans; requires cache-grype-db to be enabled"
    required: false
    default: "true"
  grype-check-for-app-update:
    description: "Enable Grype's startup version-check request to Anchore (does not control vulnerability database updates)"
    required: false
    default: "false"
  report-surface:
    description: "Report surface to publish to: summary or pr-comment"
    required: false
    default: summary
  forge:
    description: "Forge hosting the pull request: github, forgejo, or gitea"
    required: false
    default: github
  forge-api-url:
    description: "Forge API URL, usually ${{ github.api_url }}"
    required: false
    default: ${{ github.api_url }}
  token:
    description: "Forge token used when report-surface is pr-comment"
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Set up uv
      if: ${{ inputs.setup-uv == 'true' }}
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.12.23"
        working-directory: ${{ github.action_path }}
        enable-cache: "false"

    - name: Prepare Grype database cache key
      if: ${{ inputs.cache-grype-db == 'true' }}
      id: grype-db-cache-key
      shell: bash
      env:
        GRYPE_CHECK_FOR_APP_UPDATE: ${{ inputs.grype-check-for-app-update }}
      run: |
        version=$(grype version | awk '$1 == "Version:" {print $2}')
        test -n "$version"
        prefix="renovate-vuln-report-grype-db-v2-${RUNNER_OS}-${RUNNER_ARCH}-${version}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore Grype database
      if: ${{ inputs.cache-grype-db == 'true' }}
      id: grype-db-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/renovate-vuln-report-grype-db
        key: ${{ steps.grype-db-cache-key.outputs.key }}
        restore-keys: ${{ steps.grype-db-cache-key.outputs.prefix }}
        fail-on-cache-miss: "true"

    - name: Prepare scan cache key
      if: ${{ github.event_name == 'pull_request' && inputs.cache-scans == 'true' && inputs.cache-grype-db == 'true' }}
      id: scan-cache-key
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        test -n "$PR_NUMBER"
        prefix="renovate-vuln-report-scans-v1-${RUNNER_OS}-${RUNNER_ARCH}-pr-${PR_NUMBER}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

    - name: Restore Vulnerability Scans
      if: ${{ github.event_name == 'pull_request' && inputs.cache-scans == 'true' && inputs.cache-grype-db == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/renovate-vuln-report-scans
        key: ${{ steps.scan-cache-key.outputs.key }}
        restore-keys: ${{ steps.scan-cache-key.outputs.prefix }}

    - name: Generate Renovate vulnerability report
      id: report
      shell: bash
      env:
        INPUTS_CACHE_GRYPE_DB: ${{ inputs.cache-grype-db }}
        INPUTS_CACHE_SCANS: ${{ inputs.cache-scans }}
        INPUTS_FORGE_API_URL: ${{ inputs.forge-api-url }}
        GRYPE_DB_AUTO_UPDATE: "false"
        GRYPE_CHECK_FOR_APP_UPDATE: ${{ inputs.grype-check-for-app-update }}
        FORGE_TOKEN: ${{ inputs.token }}
        RENOVATE_VULN_REPORT_LOG_LEVEL: ${{ inputs.log-level }}
        RENOVATE_VULN_REPORT_SURFACE: ${{ inputs.report-surface }}
        RENOVATE_VULN_REPORT_FORGE: ${{ inputs.forge }}
      run: |
        unset RENOVATE_VULN_REPORT_SCAN_CACHE_DIR
        if [[ "$INPUTS_CACHE_GRYPE_DB" == "true" ]]; then
          export GRYPE_DB_CACHE_DIR="$RUNNER_TEMP/renovate-vuln-report-grype-db"
          if [[ "$INPUTS_CACHE_SCANS" == "true" && "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            export RENOVATE_VULN_REPORT_SCAN_CACHE_DIR="$RUNNER_TEMP/renovate-vuln-report-scans"
          fi
        fi
        uv run --locked --no-dev --isolated --project "$GITHUB_ACTION_PATH" \
          renovate-vuln-report --forge-api-url "${INPUTS_FORGE_API_URL}"

    - name: Save Vulnerability Scans
      if: ${{ !cancelled() && github.event_name == 'pull_request' && inputs.cache-scans == 'true' && inputs.cache-grype-db == 'true' && steps.report.outputs.scan-cache-updated == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/renovate-vuln-report-scans
        key: ${{ steps.scan-cache-key.outputs.key }}
